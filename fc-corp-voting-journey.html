<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FC Corp · Voting Journey</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --bg: #0a1026;
      --panel: rgba(0, 0, 0, 0.35);
      --text: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-body, "Salesforce Sans", system-ui, sans-serif);
      background: var(--bg);
      color: var(--text);
    }
    .deck {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #000;
    }
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease;
      display: grid;
      place-items: center;
      background: #000;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }
    .slide-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .vote-slide {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #06133f 0%, #001e5b 100%);
      padding: 10px 14px 14px;
    }
    .vote-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.82);
    }
    .vote-frame {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .vote-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .vote-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: rgba(255,255,255,.92);
    }
    .vote-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #a9d4ff;
    }
    .nav {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      padding: 6px 8px;
    }
    .nav button {
      border: 0;
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: rgba(255,255,255,.18);
    }
    .nav button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }
    .nav .index {
      font-size: 12px;
      color: rgba(255,255,255,.9);
      min-width: 88px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="deck" id="deck">
    <section class="slide active" data-kind="image" aria-label="Slide 1">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-01.png" alt="Slide 1" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 2">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-02.png" alt="Slide 2" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 3">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-03.png" alt="Slide 3" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 4">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-04.png" alt="Slide 4" />
    </section>

    <section class="slide" data-kind="vote" aria-label="Slide 5 voting">
      <div class="vote-slide">
        <div class="vote-head">
          <span>Slide 5 · Live Voting</span>
          <span>Presenter view</span>
        </div>
        <div class="vote-frame">
          <iframe src="/vote-live?view=presenter" title="Live voting presenter"></iframe>
        </div>
        <div class="vote-foot">
          <span>Audience scans QR shown in vote screen</span>
          <span class="vote-url">/vote-live</span>
        </div>
      </div>
    </section>

    <section class="slide" data-kind="image" aria-label="Slide 6">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-06.png" alt="Slide 6" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 7">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-07.png" alt="Slide 7" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 8">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-08.png" alt="Slide 8" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 9">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-09.png" alt="Slide 9" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 10">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-10.png" alt="Slide 10" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 11">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-11.png" alt="Slide 11" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 12">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-12.png" alt="Slide 12" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 13">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-13.png" alt="Slide 13" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 14">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-14.png" alt="Slide 14" />
    </section>
    <section class="slide" data-kind="image" aria-label="Slide 15">
      <img class="slide-image" src="assets/screenshots/fc-corp-pages/page-15.png" alt="Slide 15" />
    </section>
  </main>

  <div class="nav">
    <button id="prevBtn" type="button">Prev</button>
    <div class="index" id="indexLabel">1 / 15</div>
    <button id="nextBtn" type="button">Next</button>
  </div>

  <script>
    const slides = Array.from(document.querySelectorAll('.slide'));
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const indexLabel = document.getElementById('indexLabel');
    let current = 0;

    function go(idx) {
      const next = Math.max(0, Math.min(slides.length - 1, idx));
      slides[current].classList.remove('active');
      current = next;
      slides[current].classList.add('active');
      indexLabel.textContent = `${current + 1} / ${slides.length}`;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === slides.length - 1;
      history.replaceState(null, '', `#slide-${current + 1}`);
    }

    prevBtn.addEventListener('click', () => go(current - 1));
    nextBtn.addEventListener('click', () => go(current + 1));
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        go(current + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        go(current - 1);
      }
    });

    const hash = location.hash.match(/slide-(\d+)/);
    if (hash) go(Number(hash[1]) - 1);
    else go(0);
  </script>
</body>
</html>

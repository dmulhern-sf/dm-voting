<!DOCTYPE html>
<html lang="en" data-deck-name="Architecture Diagram 3D — Enterprise">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SF Decktools — 3D Enterprise Architecture</title>
  <link rel="stylesheet" href="tokens.css"/>
  <link rel="stylesheet" href="components.css"/>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root { --accent: #04E1CB; --accent-l: #06A59A; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080D26;
      font-family: 'Salesforce Sans', system-ui, sans-serif;
      overflow: hidden; width: 100vw; height: 100vh;
    }

    /* ── Three.js canvas ──────────────────────────────────────── */
    #three-canvas { position: fixed; inset: 0; z-index: 1; }
    #label-renderer { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

    /* ── Node labels (CSS2D) ──────────────────────────────────── */
    .node-label-wrap {
      pointer-events: none; text-align: center;
      transform: translateY(-52px);
    }
    .node-title {
      font-size: 12px; font-weight: 700; color: #fff;
      letter-spacing: 0.01em; white-space: nowrap;
      text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }
    .node-sub {
      font-size: 9px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: rgba(255,255,255,0.45);
      white-space: nowrap; text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }
    .node-chip {
      display: inline-block; margin-top: 3px;
      font-size: 8px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 999px;
      background: rgba(4,225,203,0.18); color: var(--accent);
      border: 1px solid rgba(4,225,203,0.35); white-space: nowrap;
    }
    .node-chip.purple { background: rgba(179,79,255,0.18); color: #C47FFF; border-color: rgba(179,79,255,0.35); }
    .node-chip.blue   { background: rgba(6,106,254,0.2);   color: #66A3FF; border-color: rgba(6,106,254,0.4); }
    .node-chip.orange { background: rgba(255,153,0,0.18);  color: #FF9900; border-color: rgba(255,153,0,0.35); }
    .node-chip.sap    { background: rgba(0,112,240,0.2);   color: #66AAFF; border-color: rgba(0,112,240,0.4); }

    /* ── Node logo images ─────────────────────────────────────── */
    .node-icon-img {
      display: block; margin: 0 auto 4px;
      width: 28px; height: 28px; object-fit: contain;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.5));
    }
    .node-logo-sf {
      display: block; margin: 0 auto 4px;
      width: 90px; height: auto; object-fit: contain;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.5));
    }

    /* ── SAP logo (text-based) ────────────────────────────────── */
    .sap-text {
      font-size: 18px; font-weight: 900; color: #0070F0;
      letter-spacing: -0.03em; line-height: 1;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
      margin-bottom: 2px;
    }
    /* AWS logo (text-based) */
    .aws-text {
      font-size: 14px; font-weight: 900; color: #FF9900;
      letter-spacing: 0.02em; line-height: 1;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
      margin-bottom: 2px;
    }

    /* ── Zone labels ──────────────────────────────────────────── */
    .zone-label-wrap { pointer-events: none; text-align: center; }
    .zone-text {
      font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.2); white-space: nowrap;
    }

    /* ── UI overlay ───────────────────────────────────────────── */
    #ui-overlay {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 28px 36px 80px;
    }

    .arch-header { display: flex; align-items: flex-start; justify-content: space-between; }
    .arch-eyebrow {
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 6px;
    }
    .arch-header h2 {
      font-size: clamp(16px, 1.8vw, 24px); font-weight: 700; color: #fff;
      letter-spacing: -0.02em;
    }
    .arch-legend { display: flex; gap: 16px; align-items: center; }
    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 600;
    }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* stat bar */
    .stat-bar {
      display: flex; gap: 16px; justify-content: center;
      opacity: 0; transition: opacity 0.6s ease;
    }
    .stat-bar.visible { opacity: 1; }
    .stat-pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px; padding: 7px 18px;
      display: flex; align-items: center; gap: 10px;
    }
    .stat-val  { font-size: 16px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 600; }

    /* ── Slide nav — bottom-center ────────────────────────────── */
    .slide-controls {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px; z-index: 20;
    }
    .slide-controls button {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #fff;
      font-size: 16px; cursor: pointer; pointer-events: all;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .slide-controls button:hover { background: rgba(255,255,255,0.18); }
    .slide-counter {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      color: rgba(255,255,255,0.35); min-width: 48px; text-align: center;
    }

    /* ── Presenter mode — bottom-right ────────────────────────── */
    #btn-present {
      position: fixed; bottom: 28px; right: 24px; z-index: 20;
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.6); cursor: pointer; pointer-events: all;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    #btn-present:hover { background: rgba(255,255,255,0.18); color: #fff; }

    .hint {
      position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
      font-size: 10px; color: rgba(255,255,255,0.2); z-index: 20;
      letter-spacing: 0.08em; pointer-events: none;
    }

    /* ── Slide view panels ────────────────────────────────────── */
    .slide-views {
      display: flex; gap: 8px; align-items: center; justify-content: center;
      pointer-events: all;
    }
    .view-btn {
      font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4);
      cursor: pointer; transition: all 0.15s;
    }
    .view-btn:hover, .view-btn.active { background: rgba(6,106,254,0.3); color: #fff; border-color: rgba(6,106,254,0.5); }
  </style>
</head>
<body>

<canvas id="three-canvas"></canvas>
<div id="label-renderer"></div>

<!-- UI overlay — header + stat bar -->
<div id="ui-overlay">
  <div class="arch-header">
    <div>
      <div class="arch-eyebrow">Solution Architecture · 3D View</div>
      <h2 id="arch-title">SAP → Data Cloud → Agentforce — Enterprise Stack</h2>
    </div>
    <div class="arch-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#066AFE"></div>Salesforce</div>
      <div class="legend-item"><div class="legend-dot" style="background:#04E1CB"></div>Data Flow</div>
      <div class="legend-item"><div class="legend-dot" style="background:#B34FFF"></div>AI Agents</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FF9900"></div>AWS</div>
    </div>
  </div>
  <div class="stat-bar" id="stat-bar">
    <div class="stat-pill">
      <span class="stat-val">360°</span>
      <span class="stat-label">Unified Customer Profile</span>
    </div>
    <div class="stat-pill">
      <span class="stat-val" style="color:#66A3FF">38%</span>
      <span class="stat-label">Faster Onboarding</span>
    </div>
    <div class="stat-pill">
      <span class="stat-val" style="color:#C47FFF">4×</span>
      <span class="stat-label">Agent Productivity</span>
    </div>
    <div class="stat-pill">
      <span class="stat-val" style="color:#FF9900">AWS</span>
      <span class="stat-label">Cloud Infrastructure</span>
    </div>
  </div>
</div>

<div class="hint">Drag to rotate · Scroll to zoom · Arrow keys to toggle rotation</div>

<!-- Slide nav — bottom-center -->
<nav class="slide-controls">
  <button id="btn-prev">&#8592;</button>
  <span class="slide-counter" id="counter">1 / 1</span>
  <button id="btn-next">&#8594;</button>
</nav>

<!-- Presenter mode — bottom-right -->
<button id="btn-present" title="Presenter mode" onclick="togglePresenter()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="14" rx="2"/>
    <path d="M8 21h8M12 17v4"/>
  </svg>
</button>

<script src="feedback-widget.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ── Scene setup ──────────────────────────────────────────────────
const canvas = document.getElementById('three-canvas');
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x080D26, 1);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(W, H);
labelRenderer.domElement.style.cssText = 'position:fixed;inset:0;z-index:2;pointer-events:none;';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080D26, 0.04);

const camera = new THREE.PerspectiveCamera(52, W / H, 0.1, 200);
camera.position.set(0, 3.5, 20);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 32;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;

// ── Lighting ───────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a2060, 2.2));
const dirLight = new THREE.DirectionalLight(0x4080ff, 1.6);
dirLight.position.set(5, 10, 8);
scene.add(dirLight);
const rimLight = new THREE.DirectionalLight(0x04E1CB, 0.7);
rimLight.position.set(-8, -2, -5);
scene.add(rimLight);
const orangeRim = new THREE.DirectionalLight(0xFF9900, 0.3);
orangeRim.position.set(0, -8, 4);
scene.add(orangeRim);

// ── Star field ─────────────────────────────────────────────────────
const starVerts = [];
for (let i = 0; i < 900; i++) {
  starVerts.push((Math.random() - 0.5) * 130, (Math.random() - 0.5) * 90, (Math.random() - 0.5) * 90);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.4 })));

// ── AWS ground plane ───────────────────────────────────────────────
const planeGeo = new THREE.PlaneGeometry(24, 5);
const planeMat = new THREE.MeshStandardMaterial({
  color: 0x1a0a00, emissive: 0xFF6600, emissiveIntensity: 0.04,
  transparent: true, opacity: 0.4, roughness: 1,
});
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.rotation.x = -Math.PI / 2;
plane.position.y = -1.8;
plane.userData = { targetOpacity: 0.4, revealed: false };
scene.add(plane);
// AWS label on plane
const awsLabel = document.createElement('div');
awsLabel.className = 'zone-label-wrap';
awsLabel.innerHTML = '<div class="aws-text">AWS</div><div class="zone-text" style="color:rgba(255,153,0,0.4)">CLOUD INFRASTRUCTURE</div>';
const awsObj = new CSS2DObject(awsLabel);
awsObj.position.set(-9.5, -1.6, 0);
scene.add(awsObj);

// ── Label helpers ──────────────────────────────────────────────────
function makeLabel(title, sub, chipText, chipClass, iconSrc, logoSrc) {
  const div = document.createElement('div');
  div.className = 'node-label-wrap';
  let inner = '';
  if (logoSrc) {
    inner += `<img src="${logoSrc}" class="node-logo-sf" alt="${title}" />`;
  } else if (iconSrc) {
    inner += `<img src="${iconSrc}" class="node-icon-img" alt="${title}" />`;
  }
  inner += `<div class="node-title">${title}</div>`;
  if (sub) inner += `<div class="node-sub">${sub}</div>`;
  if (chipText) inner += `<div class="node-chip ${chipClass||''}">${chipText}</div>`;
  div.innerHTML = inner;
  return new CSS2DObject(div);
}

function makeSapLabel() {
  const div = document.createElement('div');
  div.className = 'node-label-wrap';
  div.innerHTML = '<div class="sap-text">SAP</div><div class="node-sub">S/4HANA · ERP</div>';
  return new CSS2DObject(div);
}

function makeZoneLabel(text, color) {
  const div = document.createElement('div');
  div.className = 'zone-label-wrap';
  div.innerHTML = `<div class="zone-text" style="color:${color||'rgba(255,255,255,0.2)'}">${text}</div>`;
  return new CSS2DObject(div);
}

// ── Glowing box node ───────────────────────────────────────────────
function makeNode(x, y, z, colorHex, emissiveHex, w=2.4, h=1.2, d=0.5) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({
    color: colorHex, emissive: emissiveHex,
    emissiveIntensity: 0.35, transparent: true, opacity: 0.0,
    roughness: 0.4, metalness: 0.6,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: emissiveHex, transparent: true, opacity: 0.0 })
  );
  mesh.add(edges);
  mesh.userData = { targetOpacity: 0.78, edgeMat: edges.material, revealed: false };
  scene.add(mesh);
  return mesh;
}

// ── Glowing line ───────────────────────────────────────────────────
function makeLine(p1, p2, colorHex) {
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...p1), new THREE.Vector3(...p2)]);
  const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.0, linewidth: 1 });
  const line = new THREE.Line(geo, mat);
  line.userData = { targetOpacity: 0.55, revealed: false };
  scene.add(line);
  return line;
}

// ── Moving particle ────────────────────────────────────────────────
function makeParticle(colorHex) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 6, 6),
    new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0 })
  );
  mesh.userData = { t: Math.random(), speed: 0.0038 + Math.random() * 0.004, active: false };
  scene.add(mesh);
  return mesh;
}

// ── Colour palette ─────────────────────────────────────────────────
const BLUE   = 0x1a3a8f; const BLUE_E = 0x066AFE;
const TEAL   = 0x0a4040; const TEAL_E = 0x04E1CB;
const PURP   = 0x2a0a40; const PURP_E = 0xB34FFF;
const GREY   = 0x1a2040; const GREY_E = 0x4060a0;
const ORANG  = 0x2a1a00; const ORANG_E= 0xFF9900;

// ── Node layout ────────────────────────────────────────────────────
// Source zone: x≈-8  |  Integration: x≈-4.5  |  Data Cloud: x≈0
// SF Clouds: x≈4     |  Agentforce: x≈8.5

// Source systems
const nSAP   = makeNode(-8,  1.6, 0, GREY, 0x0070F0, 2.2, 1.0);
const nCRM   = makeNode(-8,  0.0, 0, GREY, GREY_E,   2.2, 1.0);
const nDW    = makeNode(-8, -1.6, 0, GREY, GREY_E,   2.2, 1.0);

// Integration
const nMule  = makeNode(-4.2, 0,   0, BLUE, BLUE_E,  2.4, 1.4);

// Data Cloud
const nDC    = makeNode( 0.0, 0,   0, TEAL, TEAL_E,  3.0, 2.0);

// SF Clouds
const nSales = makeNode( 4.4,  1.6, 0, BLUE, BLUE_E, 2.2, 1.0);
const nSvc   = makeNode( 4.4,  0.0, 0, BLUE, BLUE_E, 2.2, 1.0);
const nMC    = makeNode( 4.4, -1.6, 0, BLUE, BLUE_E, 2.2, 1.0);

// Agentforce
const nAgent = makeNode( 8.8, 0.4, 0, PURP, PURP_E, 2.8, 2.8);

// Slack (below agent)
const nSlack = makeNode( 8.8,-1.8, 0, GREY, 0x4A154B, 2.4, 0.9);

// AWS infra label (already added as plane)

// Labels
nSAP.add(makeSapLabel());
nCRM.add(makeLabel('CRM / DW', 'Snowflake · Existing', null, ''));
nDW.add(makeLabel('Web & Mobile', 'Clickstream Events', null, ''));
nMule.add(makeLabel('MuleSoft', 'API Integration', '500+ Connectors', 'blue'));
nDC.add(makeLabel('Data Cloud', 'Unified Profile', 'Real-Time Segments', '', 'assets/icons/icon-data360.png'));
nSales.add(makeLabel('Sales Cloud', 'Revenue Intelligence', null, '', null, 'assets/logos/Salesforce-Corporate-Logo-Cloud-White-RBG.svg'));
nSvc.add(makeLabel('Service Cloud', 'Case Management', null, '', null, 'assets/logos/Salesforce-Corporate-Logo-Cloud-White-RBG.svg'));
nMC.add(makeLabel('Marketing Cloud', 'Journey Orchestration', null, '', 'assets/icons/icon-marketing.png'));
nAgent.add(makeLabel('Agentforce', 'Autonomous AI', 'Atlas Reasoning', 'purple', 'assets/icons/icon-agentforce.png'));
nSlack.add(makeLabel('Slack', 'Agent Notifications', null, '', 'assets/icons/icon-slack.png'));

// Zone labels
const zSource = makeZoneLabel('SOURCE SYSTEMS', 'rgba(255,255,255,0.2)');
zSource.position.set(-8, 3.0, 0); scene.add(zSource);
const zSF = makeZoneLabel('SALESFORCE PLATFORM', 'rgba(6,106,254,0.45)');
zSF.position.set(1.5, 3.0, 0); scene.add(zSF);
const zAgent = makeZoneLabel('AGENTS', 'rgba(179,79,255,0.45)');
zAgent.position.set(8.8, 3.0, 0); scene.add(zAgent);

// ── Connections ────────────────────────────────────────────────────
const lSAP2Mule   = makeLine([-6.9,  1.6, 0], [-5.4,  0.4, 0], 0x0070F0);
const lCRM2Mule   = makeLine([-6.9,  0.0, 0], [-5.4,  0.0, 0], BLUE_E);
const lDW2Mule    = makeLine([-6.9, -1.6, 0], [-5.4, -0.4, 0], BLUE_E);
const lMule2DC    = makeLine([-3.0,  0.0, 0], [-1.5,  0.0, 0], TEAL_E);
const lDC2Sales   = makeLine([ 1.5,  0.6, 0], [ 3.3,  1.6, 0], BLUE_E);
const lDC2Svc     = makeLine([ 1.5,  0.0, 0], [ 3.3,  0.0, 0], BLUE_E);
const lDC2MC      = makeLine([ 1.5, -0.6, 0], [ 3.3, -1.6, 0], BLUE_E);
const lSales2Ag   = makeLine([ 5.5,  1.6, 0], [ 7.4,  1.0, 0], PURP_E);
const lSvc2Ag     = makeLine([ 5.5,  0.0, 0], [ 7.4,  0.4, 0], PURP_E);
const lMC2Ag      = makeLine([ 5.5, -1.6, 0], [ 7.4, -0.2, 0], PURP_E);
const lAg2Slack   = makeLine([ 8.8, -0.6, 0], [ 8.8, -1.3, 0], 0x4A154B);

// ── Particles ──────────────────────────────────────────────────────
const particles = [
  { p: makeParticle(0x0070F0), from: [-6.9,  1.6, 0], to: [-5.4,  0.4, 0] },
  { p: makeParticle(TEAL_E),   from: [-3.0,  0.0, 0], to: [-1.5,  0.0, 0] },
  { p: makeParticle(BLUE_E),   from: [ 1.5,  0.6, 0], to: [ 3.3,  1.6, 0] },
  { p: makeParticle(BLUE_E),   from: [ 1.5,  0.0, 0], to: [ 3.3,  0.0, 0] },
  { p: makeParticle(PURP_E),   from: [ 5.5,  1.6, 0], to: [ 7.4,  1.0, 0] },
  { p: makeParticle(PURP_E),   from: [ 5.5, -1.6, 0], to: [ 7.4, -0.2, 0] },
  { p: makeParticle(0xFF9900), from: [-9, -1.6, 0],   to: [ 9,   -1.6, 0] },
];
particles.forEach(({ p }, i) => { p.userData.t = i * 0.15; });

// ── Reveal sequence ────────────────────────────────────────────────
const revealSeq = [
  { objs: [nSAP, nCRM, nDW],                                    delay: 600  },
  { objs: [lSAP2Mule, lCRM2Mule, lDW2Mule],                    delay: 1100 },
  { objs: [nMule],                                               delay: 1300 },
  { objs: [lMule2DC],                                            delay: 1800 },
  { objs: [nDC],                                                 delay: 2000 },
  { objs: [lDC2Sales, lDC2Svc, lDC2MC],                        delay: 2500 },
  { objs: [nSales, nSvc, nMC],                                   delay: 2700 },
  { objs: [lSales2Ag, lSvc2Ag, lMC2Ag],                        delay: 3200 },
  { objs: [nAgent],                                              delay: 3400 },
  { objs: [nSlack, lAg2Slack, plane],                           delay: 3800 },
];

let particlesActive = false;
revealSeq.forEach(({ objs, delay }) => {
  setTimeout(() => {
    objs.forEach(o => { o.userData.revealed = true; });
    if (delay >= 3800) {
      particlesActive = true;
      setTimeout(() => {
        document.getElementById('stat-bar').classList.add('visible');
      }, 600);
    }
  }, delay);
});

// ── Animation loop ─────────────────────────────────────────────────
const clock = new THREE.Clock();
function lerp(a, b, t) { return a + (b - a) * t; }

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  controls.update();

  scene.traverse(obj => {
    if (!obj.userData) return;
    const { revealed, targetOpacity, edgeMat } = obj.userData;
    if (revealed && obj.material) {
      obj.material.opacity = lerp(obj.material.opacity, targetOpacity, 0.05);
      if (edgeMat) edgeMat.opacity = lerp(edgeMat.opacity, 0.75, 0.05);
    }
  });

  if (particlesActive) {
    particles.forEach(({ p, from, to }) => {
      p.userData.t += p.userData.speed;
      if (p.userData.t > 1) p.userData.t = 0;
      const t = p.userData.t;
      p.position.set(
        lerp(from[0], to[0], t),
        lerp(from[1], to[1], t),
        lerp(from[2], to[2], t)
      );
      const fade = t < 0.12 ? t / 0.12 : t > 0.88 ? (1 - t) / 0.12 : 1;
      p.material.opacity = fade * 0.9;
    });
  }

  // Gentle bob on key nodes
  const et = clock.getElapsedTime();
  [nDC, nAgent, nMule].forEach((n, i) => {
    n.position.y += Math.sin(et * 0.7 + i * 1.2) * 0.0007;
  });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

// ── Resize ─────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
});

// ── Keyboard nav ───────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    controls.autoRotate = !controls.autoRotate;
  }
});

controls.addEventListener('start', () => { controls.autoRotate = false; });
</script>

<script>
// ── Presenter mode ──────────────────────────────────────────────
let presenting = false;
function togglePresenter() {
  presenting = !presenting;
  const btn = document.getElementById('btn-present');
  if (presenting) {
    btn.style.background = 'rgba(6,106,254,0.5)';
    btn.style.borderColor = 'rgba(6,106,254,0.8)';
    btn.style.color = '#fff';
    btn.title = 'Exit presenter mode';
  } else {
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
    btn.title = 'Presenter mode';
  }
  const fab = document.getElementById('dt-fab');
  if (fab) fab.style.display = presenting ? 'none' : '';
}
</script>
